<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
 <g transform="translate(0 8)">
  <!-- wall plate -->
  <rect x="3" y="8" width="9" height="26" rx="2.5" fill="#8b95a1" stroke="#4b5563" stroke-width="1.5"/>
  <!-- mounting arm -->
  <path d="M11 21 L24 30" stroke="#6b7280" stroke-width="6" stroke-linecap="round"/>
  <g transform="rotate(18 38 34)">
    <!-- body -->
    <rect x="20" y="27" width="34" height="15" rx="5" fill="#eef0f3" stroke="#4b5563" stroke-width="2"/>
    <!-- sun hood -->
    <rect x="21" y="22" width="40" height="7" rx="3" fill="#374151"/>
    <!-- lens face -->
    <rect x="52" y="27" width="7" height="15" rx="2.5" fill="#1f2937"/>
    <circle cx="55.5" cy="34.5" r="3.6" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
    <circle cx="54.6" cy="33.5" r="1.1" fill="#93c5fd"/>
    <!-- status light -->
    <circle cx="26" cy="37" r="1.6" fill="#ef4444"/>
  </g>
 </g>
</svg>
